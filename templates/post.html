{% extends "base.html"%}

{% block title %}
    <title>Post</title>
{% endblock %}

{% block content %}
<body>
    <h1 style="text-align: center; color: blue;">Posts</h1>
    <div class="main", style="padding: 20px; text-align: center;">
        {% for post in posts %}
            <div class="card", style="padding: 20px; width: 500px; height: 200px; display: inline-block; text-align: left;">
                <h2><a href="{% url 'post-view' post.id %}", style="color: red;">{{post.title | slice:":25"}}</a></h2>
                <p>{{post.content | slice:":100"}} ...</p>
                <span><i>{{post.publish}}</i></span>
            </div>
        {% endfor %}
    </div>
</body>
{% endblock %}
