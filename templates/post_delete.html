{% extends 'base.html' %}

{% block content %}
<h1>Delete post</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p>{{post.title}} - postni o'chiraymi?</p>
    <input type="submit", value="O'chirish">
    <button><a href="{% url 'post-view' post.id %}">Cancel</a></button>
</form>

{% endblock content %}
