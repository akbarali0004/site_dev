<!DOCTYPE html>
<html lang="en">
  {% load static %}

  <head>
      {% block title %}
      <title>Django course</title>
      {% endblock %}
      
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      
      {% block css %}
  
      {% endblock %}
  </head>
  <body>
      <header>
          <!-- <a href="{% url 'posts' %}">Main page</a>
          <a href="{% url 'staff_list' %}">Staff</a> -->
          <nav class="navbar navbar-expand-lg navbar-light bg-light">
              <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                  <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="{% url 'posts' %}">Posts</a>
                    <a class="nav-link" href="{% url 'staff_list' %}">Staff</a>
                    
                  </div>
                </div>
              </div>
            </nav>
      </header>
      {% if user.is_authenticated %}
        <p>Xush kelibsiz, {{user.username}}!</p>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <!-- <p><a href="{% url 'logout' %}">Chiqib ketish</a></p> -->
          <input type="submit", value="Chiqib ketish">
        </form>
      {% else %}
        <p>
          <a href="{% url 'login' %}">Saytga kirish</a> |
          <a href="{% url 'signup' %}">Ro'yxatdan o'tish</a>
        </p>
      {% endif %}
  
      <div>
        {% block content %}
  
        {% endblock %}
      </div>
  </body>
</html>
